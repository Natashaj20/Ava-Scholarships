<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Tracker — Class of 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --green-dark: #1a3a2a;
      --green-med: #2d5a3d;
      --green-light: #618158;
      --green-pale: #eaf3ec;
      --gold: #c8963a;
      --cream: #f8f6f1;
      --cream-mid: #ede9e1;
      --text: #1a2a1e;
      --text-mid: #4a5a4e;
      --text-light: #8a9a8e;
      --white: #ffffff;

      --status-none-bg: #f1f5f9;
      --status-none-txt: #64748b;
      --status-none-dot: #cbd5e1;

      --status-prog-bg: #fef9c3;
      --status-prog-txt: #854d0e;
      --status-prog-dot: #eab308;

      --status-sub-bg: #dbeafe;
      --status-sub-txt: #1e40af;
      --status-sub-dot: #3b82f6;

      --status-won-bg: #dcfce7;
      --status-won-txt: #166534;
      --status-won-dot: #22c55e;

      --status-skip-bg: #fee2e2;
      --status-skip-txt: #991b1b;
      --status-skip-dot: #ef4444;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #FF69B4 0%, #FFD8F0 55%, #FF69B4 100%);
      padding: 40px 24px 32px;
      position: relative;
      overflow: hidden;
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
    }

    .header-eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: #7a1a45;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(24px, 5vw, 36px);
      color: #4a0026;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    header p {
      font-size: 13px;
      color: #7a1a45;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Progress */
    .progress-wrap {
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .progress-stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .stat {
      font-size: 12px;
      color: #7a1a45;
    }

    .stat strong {
      color: #4a0026;
      font-size: 15px;
      display: block;
    }

    .progress-pct {
      font-size: 22px;
      font-weight: 700;
      color: #a0006a;
      font-family: 'Playfair Display', serif;
    }

    .progress-bar-track {
      background: rgba(255,255,255,.4);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #FF69B4, #ff1493);
      transition: width .6s cubic-bezier(.4,0,.2,1);
    }

    /* FILTERS */
    .filters-bar {
      background: var(--white);
      border-bottom: 1px solid var(--cream-mid);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .filters-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-light);
      font-weight: 600;
      margin-right: 2px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--cream-mid);
      margin: 0 6px;
    }

    .chip {
      padding: 5px 13px;
      border-radius: 99px;
      border: 1.5px solid var(--cream-mid);
      background: transparent;
      color: var(--text-mid);
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      transition: all .15s;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--green-light);
      color: var(--green-med);
    }

    .chip.active {
      background: var(--green-med);
      border-color: var(--green-med);
      color: var(--white);
      font-weight: 600;
    }

    /* Search box */
    .search-box {
      margin-left: 6px;
      padding: 5px 10px;
      border-radius: 99px;
      border: 1.5px solid var(--cream-mid);
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      min-width: 160px;
    }

    .search-box:focus {
      border-color: var(--green-light);
      background: var(--white);
    }

    /* Add Scholarship button */
    .add-btn {
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--green-med);
      background: var(--green-med);
      color: var(--white);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background: var(--green-dark);
      border-color: var(--green-dark);
    }

    /* Data controls (export/import) */
    .data-controls {
      margin-left: 8px;
      display: flex;
      gap: 6px;
    }

    .data-btn {
      padding: 5px 10px;
      border-radius: 99px;
      border: 1.5px solid var(--cream-mid);
      background: var(--white);
      color: var(--text-mid);
      font-size: 11px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .15s;
    }

    .data-btn:hover {
      border-color: var(--green-light);
      color: var(--green-med);
    }

    /* MAIN */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    /* Category section */
    .cat-section {
      margin-bottom: 36px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .cat-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--green-med);
      white-space: nowrap;
    }

    .cat-line {
      flex: 1;
      height: 1px;
      background: var(--cream-mid);
    }

    .cat-count {
      font-size: 11px;
      color: var(--text-light);
    }

    /* Card */
    .card {
      background: var(--white);
      border-radius: 12px;
      border: 1.5px solid var(--cream-mid);
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    .card.status-in-progress {
      border-color: #fde68a;
    }

    .card.status-submitted {
      border-color: #93c5fd;
    }

    .card.status-won {
      border-color: #86efac;
      box-shadow: 0 2px 12px rgba(34,197,94,.12);
    }

    .card.status-not-eligible {
      border-color: #fca5a5;
    }

    .card-main {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 15px 16px;
      cursor: pointer;
      user-select: none;
    }

    /* Status dot icon */
    .status-dot {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 2px solid var(--cream-mid);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all .2s;
    }

    .status-dot.none {
      border-color: var(--status-none-dot);
      background: transparent;
    }

    .status-dot.progress {
      border-color: var(--status-prog-dot);
      background: var(--status-prog-dot);
      color: #fff;
      font-size: 10px;
    }

    .status-dot.submitted {
      border-color: var(--status-sub-dot);
      background: var(--status-sub-dot);
      color: #fff;
    }

    .status-dot.won {
      border-color: var(--status-won-dot);
      background: var(--status-won-dot);
      color: #fff;
      font-size: 11px;
    }

    .status-dot.ineligible {
      border-color: var(--status-skip-dot);
      background: var(--status-skip-dot);
      color: #fff;
      font-size: 10px;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .card.status-not-eligible .card-name {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .card-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .card-amount {
      font-size: 13px;
      font-weight: 700;
      color: var(--green-med);
    }

    .card-deadline {
      font-size: 12px;
      color: var(--text-light);
    }

    .badge {
      font-size: 10px;
      border-radius: 4px;
      padding: 2px 7px;
      font-weight: 700;
      white-space: nowrap;
    }
